<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日热搜 - 建设中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #fdf6f6 0%, #f0f7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .card {
      text-align: center;
      background: #fff;
      padding: 60px 48px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 520px;
    }
    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #e64545;
      letter-spacing: 2px;
    }
    .logo .fire { margin-right: 8px; }
    .tagline {
      margin-top: 12px;
      font-size: 16px;
      color: #666;
    }
    .divider {
      height: 1px;
      background: #eee;
      margin: 28px 0;
    }
    .status {
      display: inline-block;
      padding: 6px 18px;
      background: #fff3e0;
      color: #e65100;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
    }
    .plan {
      margin-top: 24px;
      font-size: 14px;
      color: #888;
      line-height: 1.9;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="fire">🔥</span>今日热搜</div>
    <p class="tagline">一眼看懂今天大家都在搜什么</p>
    <div class="divider"></div>
    <span class="status">🔨 网站建设中</span>
    <p class="plan">
      Day 7 将上线第一个可用版本（MVP）<br>
      当前是 Day 2 的占位页面，仅用于跑通 GitHub 流程
    </p>
    <p class="footer">今日热搜 · 28 天项目 · Day 2 占位页</p>
  </div>
</body>
</html>
